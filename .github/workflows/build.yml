name: Build App IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: 🚀 AUTO-GENERATE APPLE NATIVE FULL SCREEN 🚀
        run: |
          # 1. Hapus file manual lama yang sering ditolak Xcode
          rm -f ibaal-cert-store/Info.plist
          rm -f ibaal-cert-store/LaunchScreen.storyboard
          
          # 2. Bikin Asset Catalog Resmi (Syarat mutlak agar iOS menganggap ini aplikasi modern)
          mkdir -p ibaal-cert-store/Assets.xcassets/AppIcon.appiconset
          cat << 'EOF' > ibaal-cert-store/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images": [],
            "info": { "author": "xcode", "version": 1 }
          }
          EOF
          
          # 3. Rakit project.yml yang MEMAKSA Xcode membuat LaunchScreen Asli dari sistem!
          cat << 'EOF' > project.yml
          name: ibaal-cert-store
          options:
            bundleIdPrefix: com.ibaal
            deploymentTarget:
              iOS: "15.0"
            xcodeVersion: "15.0"
          targets:
            ibaal-cert-store:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: ibaal-cert-store
              info:
                path: ibaal-cert-store/Info.plist
              settings:
                base:
                  # --- PENGATURAN WAJIB ---
                  PRODUCT_NAME: "ibaal cert store"
                  PRODUCT_BUNDLE_IDENTIFIER: "com.ibaal.sales.fs1"
                  TARGETED_DEVICE_FAMILY: "1"
                  SWIFT_VERSION: "5.0"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_ALLOWED: "NO"
                  ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
                  
                  # --- KUNCI FULL SCREEN NATIVE XCODE ---
                  GENERATE_INFOPLIST_FILE: "YES"
                  CURRENT_PROJECT_VERSION: "1"
                  MARKETING_VERSION: "1.0"
                  INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
                  
                  # --- PENGATURAN TAMPILAN STANDAR ---
                  INFOPLIST_KEY_LSRequiresIPhoneOS: "YES"
                  INFOPLIST_KEY_UIStatusBarStyle: "UIStatusBarStyleLightContent"
                  INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: "NO"
          EOF
          
          # 4. Info.plist minimalis HANYA untuk mendaftarkan Font Mali (sisanya Apple yang urus otomatis)
          cat << 'EOF' > ibaal-cert-store/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>UIAppFonts</key>
              <array>
                  <string>Mali-Bold.ttf</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application Archive
        run: |
          xcodebuild -project ibaal-cert-store.xcodeproj \
            -scheme ibaal-cert-store \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ibaal-cert-store.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ibaal-cert-store.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r ibaal-cert-store.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibaal-cert-store-IPA
          path: build/ibaal-cert-store.ipa
