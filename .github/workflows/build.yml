name: Build NFSMWO IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Clean and Build Application
        run: |
          xcodebuild -project NFSMWOnline.xcodeproj \
            -scheme NFSMWOnline \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath .build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r .build_output/Build/Products/Debug-iphoneos/*.app build/Payload/
          cd build
          zip -r NFSMWOnline.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFSMWOnline-IPA
          path: build/NFSMWOnline.ipa
