name: Build App IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: 🔥 Fix Full Screen (Script Nuklir) 🔥
        run: |
          # 1. Bikin Warna Background Hitam Resmi untuk LaunchScreen
          mkdir -p ibaal-cert-store/Assets.xcassets/LaunchColor.colorset
          cat << 'EOF' > ibaal-cert-store/Assets.xcassets/LaunchColor.colorset/Contents.json
          {
            "colors": [ { "color": { "color-space": "srgb", "components": { "alpha": "1.000", "blue": "0.04", "green": "0.04", "red": "0.04" } }, "idiom": "universal" } ],
            "info": { "author": "xcode", "version": 1 }
          }
          EOF
          
          # 2. Paksa Info.plist menggunakan LaunchColor
          cat << 'EOF' > ibaal-cert-store/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>3</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIAppFonts</key>
              <array>
                  <string>Mali-Bold.ttf</string>
              </array>
              <key>UILaunchScreen</key>
              <dict>
                  <key>UIColorName</key>
                  <string>LaunchColor</string>
              </dict>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF
          
          # 3. Paksa project.yml dengan Bundle ID baru agar Cache iPhone Reset!
          cat << 'EOF' > project.yml
          name: ibaal-cert-store
          options:
            bundleIdPrefix: com.ibaal
            deploymentTarget:
              iOS: "15.0"
            xcodeVersion: "15.0"
          targets:
            ibaal-cert-store:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: ibaal-cert-store
              info:
                path: ibaal-cert-store/Info.plist
              settings:
                base:
                  PRODUCT_NAME: "ibaal cert store"
                  PRODUCT_BUNDLE_IDENTIFIER: "com.ibaal.sales.v3"
                  TARGETED_DEVICE_FAMILY: "1"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_ALLOWED: "NO"
          EOF

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application Archive
        run: |
          xcodebuild -project ibaal-cert-store.xcodeproj \
            -scheme ibaal-cert-store \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ibaal-cert-store.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ibaal-cert-store.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r ibaal-cert-store.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibaal-cert-store-IPA
          path: build/ibaal-cert-store.ipa
