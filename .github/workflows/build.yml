name: Build App IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: 🛠️ Setup Project Files (Anti Error 65 & Fix Full Screen)
        run: |
          # 1. Hapus sisa folder yang bikin error kompilasi sebelumnya
          rm -rf ibaal-cert-store/Assets.xcassets

          # 2. Bikin Info.plist Standar Resmi Apple yang LENGKAP
          cat << 'EOF' > ibaal-cert-store/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleDisplayName</key>
              <string>ibaal cert store</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>4</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIAppFonts</key>
              <array>
                  <string>Mali-Bold.ttf</string>
              </array>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>UIStatusBarStyle</key>
              <string>UIStatusBarStyleLightContent</string>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <false/>
          </dict>
          </plist>
          EOF
          
          # 3. Bikin File LaunchScreen.storyboard Murni (Biar iOS Ngebaca Layar Penuh)
          cat << 'EOF' > ibaal-cert-store/LaunchScreen.storyboard
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="22505" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <device id="retina6_12" orientation="portrait" appearance="dark"/>
              <dependencies>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="22504"/>
                  <capability name="Safe area layout guides" minToolsVersion="9.0"/>
                  <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                  <rect key="frame" x="0.0" y="0.0" width="393" height="852"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <viewLayoutGuide key="safeArea" id="6Tk-OE-BBY"/>
                                  <color key="backgroundColor" white="0.0" alpha="1" colorSpace="custom" customColorSpace="genericGamma22GrayColorSpace"/>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                      <point key="canvasLocation" x="53" y="375"/>
                  </scene>
              </scenes>
          </document>
          EOF

          # 4. Bikin project.yml LENGKAP DENGAN SWIFT_VERSION
          cat << 'EOF' > project.yml
          name: ibaal-cert-store
          options:
            bundleIdPrefix: com.ibaal
            deploymentTarget:
              iOS: "15.0"
            xcodeVersion: "15.0"
          targets:
            ibaal-cert-store:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: ibaal-cert-store
              info:
                path: ibaal-cert-store/Info.plist
              settings:
                base:
                  PRODUCT_NAME: "ibaal cert store"
                  PRODUCT_BUNDLE_IDENTIFIER: "com.ibaal.sales.v4"
                  TARGETED_DEVICE_FAMILY: "1"
                  SWIFT_VERSION: "5.0"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_ALLOWED: "NO"
          EOF

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application Archive
        run: |
          xcodebuild -project ibaal-cert-store.xcodeproj \
            -scheme ibaal-cert-store \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ibaal-cert-store.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ibaal-cert-store.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r ibaal-cert-store.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibaal-cert-store-IPA
          path: build/ibaal-cert-store.ipa
