name: ibaal-cert-store
options:
  bundleIdPrefix: com.ibaal
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

settings:
  base:
    PRODUCT_NAME: "ibaal cert store"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  ibaal-cert-store:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ibaal-cert-store
    info:
      path: ibaal-cert-store/Info.plist
    settings:
      base:
        INFOPLIST_FILE: ibaal-cert-store/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ibaal.certstore
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"
