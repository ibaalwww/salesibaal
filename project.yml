name: NFSMWOnline
options:
  bundleIdPrefix: com.ibaal
  deploymentTarget:
    iOS: "15.0"
  compatibilityVersion: "Xcode 14.0"

targets:
  NFSMWOnline:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ConsoleApp
    settings:
      base:
        PRODUCT_NAME: "NFSMWOnline"
        PRODUCT_BUNDLE_IDENTIFIER: "com.ibaal.nfsmwo.game"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_CFBundleDisplayName: "NFS MW Online"
        INFOPLIST_KEY_UIRequiresFullScreen: true
        INFOPLIST_KEY_UIStatusBarHidden: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
